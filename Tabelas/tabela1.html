<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table, th, tr, td, caption{
            border: 2px solid plum;
            border-collapse: collapse;text-align: center;
            padding: 10px;
        }
        caption{
            font-size: 20px;
            font-weight: bold;
            background-color: plum;
        }
        th{
            background-color: rgb(238, 199, 238);
        }
        td{
            background-color: rgb(238, 255, 203);
        }
    </style>
</head>
<body>
    <table>
        <caption>Trajetória Acadêmica e Profissional</caption>
        <tr>
            <th rowspan="2">Estudante</th>
            <th colspan="2">Formação</th>
            <th rowspan="2">Ano de Conclusão</th>
        </tr>
        <tr>            
            <th >Formação</th>
            <th>Pós-graduação</th>
        </tr>
        <tr>
            <th>José</th>
            <td>Ciência da Computação</td>
            <td>Inteligência Artificial</td>
            <td>2023</td>
        </tr>
        <tr>
            <th>Ana</th>
            <td>Engenharia de Software</td>
            <td>Gestão de Projetos</td>
            <td>2022</td>
        </tr>
    </table>
</body>
</html>
